<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso — JGStudio</title>
    <link rel="icon" type="image/svg+xml" href="img/logo.svg">
    <link href="https://api.fontshare.com/v2/css?f[]=cabinet-grotesk@700,800&f[]=satoshi@400,500,700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        @keyframes meshDrift {
            0%   { background-position: 0% 50%; }
            50%  { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(20px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        @keyframes logoGlow {
            0%, 100% { filter: drop-shadow(0 0 20px rgba(255,42,64,0.0)); }
            50%      { filter: drop-shadow(0 0 40px rgba(255,42,64,0.15)); }
        }

        :root {
            --void: #020204;
            --surface: #08080c;
            --border-dim: rgba(255,255,255,0.04);
            --border-mid: rgba(255,255,255,0.08);
            --text-bright: #f0f0f2;
            --text-soft: #6e6e7a;
            --text-whisper: #3e3e48;
            --red: #ff2a40;
            --red-soft: rgba(255,42,64,0.12);
            --f-display: 'Cabinet Grotesk', sans-serif;
            --f-body: 'Satoshi', sans-serif;
            --f-mono: 'JetBrains Mono', monospace;
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: var(--void);
            color: var(--text-bright);
            font-family: var(--f-body);
            -webkit-font-smoothing: antialiased;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            position: relative;
            overflow: hidden;
        }

        /* Living background */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background:
                radial-gradient(ellipse 60% 50% at 20% 30%, rgba(255,42,64,0.05), transparent),
                radial-gradient(ellipse 50% 60% at 80% 70%, rgba(60,60,120,0.03), transparent);
            background-size: 200% 200%;
            animation: meshDrift 20s ease infinite;
            pointer-events: none;
        }

        /* Noise */
        body::after {
            content: '';
            position: fixed;
            inset: 0;
            opacity: 0.02;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
            pointer-events: none;
        }

        .login-wrapper {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 420px;
            animation: fadeUp 0.7s ease forwards;
        }

        /* Logo area */
        .login-logo-area {
            text-align: center;
            margin-bottom: 48px;
        }

        .login-logo {
            width: 140px;
            margin-bottom: 0;
            animation: logoGlow 4s ease infinite;
        }

        /* The card */
        .login-card {
            background: var(--surface);
            border: 1px solid var(--border-dim);
            border-radius: 20px;
            padding: 40px;
            position: relative;
            overflow: hidden;
        }

        .login-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255,42,64,0.3), transparent);
        }

        .login-card-title {
            font-family: var(--f-display);
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            margin-bottom: 4px;
        }

        .login-card-sub {
            font-family: var(--f-mono);
            font-size: 0.65rem;
            color: var(--text-whisper);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 36px;
        }

        /* Form */
        .login-form {
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .field-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .field-group label {
            font-family: var(--f-mono);
            font-size: 0.6rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--text-soft);
        }

        .field-group input {
            background: var(--void);
            border: 1px solid var(--border-dim);
            padding: 14px 16px;
            border-radius: 10px;
            color: var(--text-bright);
            font-family: var(--f-mono);
            font-size: 0.9rem;
            outline: none;
            transition: all 0.3s ease;
            width: 100%;
        }

        .field-group input::placeholder {
            color: var(--text-whisper);
        }

        .field-group input:focus {
            border-color: var(--red);
            box-shadow: 0 0 0 3px var(--red-soft), 0 0 20px rgba(255,42,64,0.05);
            background: rgba(255,42,64,0.02);
        }

        /* Button */
        .login-btn {
            background: var(--red);
            color: #fff;
            border: none;
            padding: 14px;
            border-radius: 10px;
            font-family: var(--f-body);
            font-weight: 700;
            font-size: 0.9rem;
            letter-spacing: 0.5px;
            cursor: pointer;
            margin-top: 8px;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
            overflow: hidden;
        }

        .login-btn::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, transparent 40%, rgba(255,255,255,0.1));
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(255,42,64,0.35);
        }

        .login-btn:hover::after { opacity: 1; }

        .login-btn:active {
            transform: translateY(0);
        }

        .login-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        /* Error */
        .login-error {
            color: var(--red);
            font-family: var(--f-mono);
            font-size: 0.75rem;
            text-align: center;
            margin-top: 12px;
            display: none;
            padding: 10px;
            background: var(--red-soft);
            border-radius: 8px;
        }

        /* Back link */
        .login-footer {
            text-align: center;
            margin-top: 28px;
        }

        .back-link {
            font-family: var(--f-mono);
            font-size: 0.7rem;
            color: var(--text-soft);
            text-decoration: none;
            letter-spacing: 0.5px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: color 0.25s ease;
        }

        .back-link:hover {
            color: var(--text-bright);
        }

        /* Separator */
        .login-divider {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 4px 0;
        }

        .login-divider::before, .login-divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--border-dim);
        }

        .login-divider span {
            font-family: var(--f-mono);
            font-size: 0.55rem;
            color: var(--text-whisper);
            text-transform: uppercase;
            letter-spacing: 2px;
        }
    </style>
</head>
<body>

    <div class="login-wrapper">
        <div class="login-logo-area">
            <img src="img/logo_jgs_oficial.png" alt="JGStudio" class="login-logo">
        </div>

        <div class="login-card">
            <h2 class="login-card-title">Bienvenido</h2>
            <p class="login-card-sub">Acceso privado al portal</p>

            <form class="login-form" id="loginForm">
                <div class="field-group">
                    <label for="email">Correo electrónico</label>
                    <input type="email" id="email" required placeholder="tu@empresa.com" autocomplete="email">
                </div>
                <div class="field-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" required placeholder="••••••••" autocomplete="current-password">
                </div>

                <div class="login-divider"><span>Continuar</span></div>

                <button type="submit" class="login-btn" id="loginBtn">
                    Iniciar Sesión <i class="fas fa-arrow-right" style="margin-left:6px;font-size:0.8rem;"></i>
                </button>
                <div class="login-error" id="errorMsg">Credenciales incorrectas. Inténtalo de nuevo.</div>
            </form>
        </div>

        <div class="login-footer">
            <a href="index.html" class="back-link"><i class="fas fa-arrow-left"></i> Volver a jgstudio.dev</a>
        </div>
    </div>

    <!-- Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="jg_core_v3.js"></script>
    
    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const btn = document.getElementById('loginBtn');
            const errorMsg = document.getElementById('errorMsg');
            
            btn.textContent = 'Verificando...';
            btn.disabled = true;
            errorMsg.style.display = 'none';
            
            try {
                // Llamar a la función real conectada a Supabase
                const result = await login(email, password);
                
                // Redirigir según el rol
                if (result.user.role === 'admin') {
                    window.location.href = 'admin.html';
                } else {
                    window.location.href = 'portal.html';
                }
            } catch (error) {
                errorMsg.style.display = 'block';
                errorMsg.textContent = error.message;
                btn.innerHTML = 'Iniciar Sesión <i class="fas fa-arrow-right" style="margin-left:6px;font-size:0.8rem;"></i>';
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
